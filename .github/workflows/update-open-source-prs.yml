name: Update Open Source Contributions

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "scripts/update_contributions.py"
      - ".github/workflows/update-open-source-prs.yml"
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Build contribution table
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_contributions.py

      - name: Commit README changes
        run: |
          if git diff --quiet README.md; then
            echo "No contribution changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update recent open source contributions"
          git push
